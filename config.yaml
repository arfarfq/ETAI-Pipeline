# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race" # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"] # identifiers / COMPAS's own score, not our model's inputs

split:
  test_size: 0.2
  random_state: 42

model:
  type: "decision_tree" #"logistic_regression" # or "decision_tree"
  params:
    max_depth: 10

output:
  results_dir: "results" # each run's full report is saved here as a timestamped .txt file

diagnostics:
  id_column: "id"

  candidate_predictors:
    - "sex"
    - "race"
    - "age_cat"
    - "c_charge_degree"
    - "score_text"

  missingness_verdicts:
    age: "MCAR"
    juv_fel_count: "MCAR"
    priors_count: "MNAR"
    c_charge_degree: "MNAR"
    race: "MCAR"
    sex: "MCAR"

  domain_rules:
    age:
      min: 18
      max: 100

    decile_score:
      min: 1
      max: 10

    juv_fel_count:
      min: 0

    priors_count:
      min: 0
      max: 60

  placeholder_tokens:
    - ""
    - "-"
    - "?"
    - "N/A"
    - "NA"
    - "n/a"
    - "na"

  canonical_maps:
    sex:
      male: "Male"
      female: "Female"

    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"

    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"

    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

  columns_to_drop:
    - "prior_offenses"
    - "age_in_months"
    - "juvenile_total"
    - "id"

  duplicate_check:
    exact_row_duplicates: 72
    repeated_ids: 72
